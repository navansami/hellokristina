name: hello_kristina
description: A playful Serbian learning app.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.5
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/kristina.jpg
    - assets/kristina-pose.png
    - assets/course/serbian-en.v1.json
    - assets/audio/serbian/
    - assets/audio/effects/
